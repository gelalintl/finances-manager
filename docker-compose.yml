services:
  postgres:
    image: postgres:16-alpine
    container_name: personalfinance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: personalfinance_db
    ports:
      - '5434:5432'
    volumes:
      - personalfinance_data:/var/lib/postgresql/data

volumes:
  personalfinance_data:
